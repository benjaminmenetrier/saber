geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 71
    ny : 53
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_horizontal_streamfunction
    levels: 2
background:
  date: &date 2010-01-01T12:00:00Z
  state variables: &vars
  - air_horizontal_streamfunction
bands:
- band:
    filter:
    - saber block name: Biperiodization
      biperiodization:
        x inner extension: 0
        y inner extension: 0
        x outer extension: 20
        y outer extension: 20
    - saber block name: BifourierSpectralToGrid
      right-inverse of a following block: true
    - saber block name: BifourierAnalyticalFilter
      waveband peak: 2
      waveband max: 5
      active variables: *vars
    - saber block name: BifourierSpectralToGrid
    - saber block name: Biperiodization
      biperiodization:
        x inner extension: 20
        y inner extension: 20
        x outer extension: 0
        y outer extension: 0
  output:
    model write:
      filepath: testdata/process_perts_bifourier_1/filtered_pert_mb%MEM%_wb1
      member pattern: '%MEM%'
- band:
    filter:
    - saber block name: Biperiodization
      biperiodization:
        x inner extension: 0
        y inner extension: 0
        x outer extension: 20
        y outer extension: 20
    - saber block name: BifourierSpectralToGrid
      right-inverse of a following block: true
    - saber block name: BifourierAnalyticalFilter
      waveband min: 2
      waveband peak: 5
      active variables: *vars
    - saber block name: BifourierSpectralToGrid
      filter mode: true
    - saber block name: Biperiodization
      biperiodization:
        x inner extension: 20
        y inner extension: 20
        x outer extension: 0
        y outer extension: 0
  output:
    model write:
      filepath: testdata/process_perts_bifourier_1/filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'
ensemble:
  date: *date
  members from template:
    template:
      date: *date
      filepath: testdata/randomization_fastlam/_MPI_-1_member_%MEM%
      variables: *vars
    nmembers: 2
    pattern: '%MEM%'
    zero padding: 6
input variables: *vars
test:
  reference filename: testref/process_perts_bifourier_1.ref

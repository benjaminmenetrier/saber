geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 150
    ny : 150
    dx : 40e3
    dy : 40e3
    lonlat(centre) : [-78.0, 11.6]
    projection :  
      type : lambert_conformal_conic
      latitude0  : 11.6
      longitude0 : -78.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_horizontal_streamfunction
    levels: 1
  halo: 1
  latitude south to north: false
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - air_horizontal_streamfunction
background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      io:
        data directory: testdata
        files prefix: error_covariance_training_doc_6/_MPI_-_OMP_
      drivers:
        multivariate strategy: univariate
        compute nicas: true
        write local nicas: true
        write nicas grids: true
        write nicas steps: true
        internal dirac test: true
      nicas:
        resolution: 5.0
        explicit length-scales: true
        horizontal length-scale:
        - groups:
          - air_horizontal_streamfunction
          value: 1500.0e3
        vertical length-scale:
        - groups:
          - air_horizontal_streamfunction
          value: 3.0
        smooth interpolation factor: 0.5
      dirac:
      - longitude: -78.0
        latitude: 11.6
        level: 1
        variable: air_horizontal_streamfunction
      output model files:
      - parameter: dirac_nicas
        file:
          filepath: testdata/error_covariance_training_doc_6/_MPI_-_OMP__dirac_nicas

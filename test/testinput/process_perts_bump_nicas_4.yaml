geometry:
  function space: StructuredColumns
  grid:
    type : regional
    nx : 71
    ny : 53
    dx : 2.5e3
    dy : 2.5e3
    lonlat(centre) : [9.9, 56.3]
    projection :
      type : lambert_conformal_conic
      latitude0  : 56.3
      longitude0 : 0.0
    y_numbering: 1
  partitioner: checkerboard
  groups:
  - variables:
    - air_horizontal_streamfunction
    levels: 2
background:
  date: &date 2010-01-01T12:00:00Z
  state variables: &vars
  - air_horizontal_streamfunction
bands:
- band:
    filter:
    - saber block name: BUMP_NICASFilter
      read:
        general:
          testing: true
          universe length-scale: 100.0e3
        io:
          data directory: testdata
          files prefix: process_perts_bump_nicas_4/_MPI_-_OMP_
        drivers:
          multivariate strategy: univariate
          compute nicas: true
          write local nicas: true
        nicas:
          filter mode: true
          filter resolution: 8.0
          explicit length-scales: true
          horizontal length-scale:
          - groups:
            - air_horizontal_streamfunction
            value: 50.0e3
          same horizontal convolution: true
  output:
    model write:
      filepath: testdata/process_perts_bump_nicas_4/filtered_pert_mb%MEM%_wb1
      member pattern: '%MEM%'
- output:
    model write:
      filepath: testdata/process_perts_bump_nicas_4/filtered_pert_mb%MEM%_wb2
      member pattern: '%MEM%'
ensemble:
  date: *date
  members from template:
    template:
      date: *date
      filepath: testdata/randomization_fastlam/_MPI_-1_member_%MEM%
      variables: *vars
    nmembers: 2
    pattern: '%MEM%'
    zero padding: 6
input variables: *vars
test:
  reference filename: testref/process_perts_bump_nicas_4.ref

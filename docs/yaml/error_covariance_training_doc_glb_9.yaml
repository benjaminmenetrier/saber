        data directory: testdata
        files prefix: error_covariance_training_doc_glb_9/_MPI_-_OMP_
      drivers:
        compute nicas: true
        multivariate strategy: univariate
        write nicas grids: true
      nicas:
        resolution: 7
      input model files:
      - parameter: rh
        file:
          filepath:  testdata/randomization_doc_glb_2/_MPI_-_OMP__rh2_000001
      - parameter: rv
        file:
          filepath: testdata/convertstate_doc_glb/rv

input geometry: &geom
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 50
  groups:
  - variables:
    - air_horizontal_streamfunction
    levels: 1
  halo: 1
output geometry: *geom
states:
- input:
    date: 2010-01-01T12:00:00Z
    state variables:
    - air_horizontal_streamfunction
    constant value: 3000.0e3
  output:
    filepath: testdata/convertstate_doc_glb/rh1_avg
- input:
    date: 2010-01-01T12:00:00Z
    state variables:
    - air_horizontal_streamfunction
    constant value: -500.0e3
  output:
    filepath: testdata/convertstate_doc_glb/rh1_pert
- input:
    date: 2010-01-01T12:00:00Z
    state variables:
    - air_horizontal_streamfunction
    constant value: 3000.0e3
  output:
    filepath: testdata/convertstate_doc_glb/rh2_avg
- input:
    date: 2010-01-01T12:00:00Z
    state variables:
    - air_horizontal_streamfunction
    constant value: 500.0e3
  output:
    filepath: testdata/convertstate_doc_glb/rh2_pert
- input:
    date: 2010-01-01T12:00:00Z
    state variables:
    - air_horizontal_streamfunction
    constant value: 0.2
  output:
    filepath: testdata/convertstate_doc_glb/rhc_pert
- input:
    date: 2010-01-01T12:00:00Z
    state variables:
    - air_horizontal_streamfunction
  output:
    filepath: testdata/convertstate_doc_glb/rv
